<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>木地板爆款内容分析器 V3.5</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#111;--muted:#777;--line:#e4e4de;--soft:#efefe9;--ok:#08783f;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:16px 14px 80px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{font-size:23px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}.badge{background:#111;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.label{font-size:13px;font-weight:800;margin:0 0 7px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;outline:none}textarea{min-height:105px;resize:vertical;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:var(--soft);color:#111}.danger{background:#fff0ee;color:var(--bad)}button:disabled{opacity:.5}.status{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;margin-top:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat,.decision{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:22px}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.decision-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px}.decision h3{margin:0 0 8px;font-size:14px}.decision .big{font-size:18px;font-weight:900;line-height:1.4}.decision .small{font-size:12px;color:var(--muted);line-height:1.6}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f0f0eb;border-radius:999px;padding:5px 8px;font-size:11px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.toolbar input{flex:1;min-width:0}.toolbar select{width:auto}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:900px;background:#fff}th,td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}th{background:#f8f8f5;position:sticky;top:0}td.title{font-weight:800;max-width:340px}.empty{text-align:center;color:var(--muted);padding:28px}.rank{font-weight:900}.foot{font-size:11px;color:#777;line-height:1.6;margin-top:12px}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.decision-grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>木地板爆款内容分析器</h1><div class="sub">抓真实商品数据 · 判断下一条怎么发</div></div><div class="badge">V3.5</div></div>
<div class="card">
<div class="label">闲鱼搜索网址</div>
<textarea id="urls" placeholder="粘贴闲鱼搜索结果网址，例如：https://www.goofish.com/search?q=木地板"></textarea>
<div class="actions"><button class="primary" id="run">开始分析</button><button class="danger" id="clear">清空数据</button></div>
<div id="status" class="status">粘贴链接后直接分析，不做无意义的登录检测。</div>
</div>
<div class="stats">
<div class="stat"><b id="sItems">0</b><span>识别商品</span></div>
<div class="stat"><b id="sWant">0</b><span>有想要数据</span></div>
<div class="stat"><b id="sPrice">—</b><span>中位价格</span></div>
<div class="stat"><b id="sTop">—</b><span>最高想要</span></div>
</div>
<div class="card">
<div class="label">下一条怎么发</div>
<div class="decision-grid">
<div class="decision"><h3>建议标题方向</h3><div id="titleAdvice" class="big">抓取后生成</div><div id="titleWhy" class="small"></div></div>
<div class="decision"><h3>价格参考</h3><div id="priceAdvice" class="big">抓取后生成</div><div id="priceWhy" class="small"></div></div>
<div class="decision"><h3>高频有效词</h3><div id="keywordChips" class="chips"><span class="chip">等待数据</span></div></div>
</div>
</div>
<div class="card">
<div class="toolbar"><input id="filter" placeholder="筛选商品标题"><select id="sort"><option value="want">想要人数优先</option><option value="rank">搜索排名优先</option></select><button class="secondary" id="export">导出 CSV</button></div>
<div class="table-wrap"><table><thead><tr><th>排名</th><th>商品标题</th><th>价格</th><th>想要</th><th>规格</th><th>来源</th></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty">还没有商品数据。</div></div>
</div>
<div class="foot">V3.5 只保留对发布决策有用的数据：排名、标题、价格、想要、规格，并直接给出下一条发布建议。</div>
</div>
<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem('floorV35Items')||'[]');
function save(){localStorage.setItem('floorV35Items',JSON.stringify(items))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){if(n==null)return '—';if(n>=10000)return (n/10000).toFixed(n>=100000?0:1)+'万';if(n>=1000)return (n/1000).toFixed(1)+'k';return String(Math.round(n))}
function status(t,c=''){$('status').className='status '+c;$('status').textContent=t}
function median(a){const x=a.filter(Number.isFinite).sort((a,b)=>a-b);if(!x.length)return null;const m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2}
function keywords(list){const stop=/^(木地板|地板|实木|二手|全新|包邮|出售|处理|现货|平方|平米)$/;const map={};for(const x of list){for(const w of String(x.title||'').match(/[\u4e00-\u9fa5]{2,6}/g)||[]){if(stop.test(w))continue;map[w]=(map[w]||0)+(x.favs||1)}}return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0])}
function buildAdvice(){const useful=items.filter(x=>x.favs!=null);const top=[...useful].sort((a,b)=>(b.favs||0)-(a.favs||0)).slice(0,10);const prices=top.map(x=>x.price).filter(Number.isFinite);const med=median(prices);const words=keywords(top.length?top:items);$('sItems').textContent=items.length;$('sWant').textContent=useful.length;$('sPrice').textContent=med==null?'—':'¥'+Math.round(med);$('sTop').textContent=top.length?fmt(top[0].favs):'—';$('keywordChips').innerHTML=(words.length?words:['暂无有效词']).map(w=>`<span class="chip">${esc(w)}</span>`).join('');if(top.length){const base=top[0].title.replace(/[¥￥].*$/,'').slice(0,38);$('titleAdvice').textContent=base;$('titleWhy').textContent='优先参考“想要”最高的真实商品标题结构，再替换成你自己的木种/规格/卖点。';}else{$('titleAdvice').textContent='先抓到带“想要”数据的商品';$('titleWhy').textContent='没有互动数据时，不做假判断。';}if(med!=null){$('priceAdvice').textContent='参考 ¥'+Math.round(med);$('priceWhy').textContent='基于当前高“想要”商品价格中位数，不建议机械照抄，结合你的成本和规格调整。';}else{$('priceAdvice').textContent='暂无价格参考';$('priceWhy').textContent='当前抓取结果缺少有效价格数据。';}}
function render(){let q=$('filter').value.trim().toLowerCase();let list=items.filter(x=>!q||String(x.title||'').toLowerCase().includes(q));if($('sort').value==='want')list.sort((a,b)=>(b.favs??-1)-(a.favs??-1));else list.sort((a,b)=>(a.rank??999)-(b.rank??999));$('body').innerHTML=list.map(x=>`<tr><td class="rank">${x.rank??'—'}</td><td class="title">${esc(x.title)}</td><td>${x.price!=null?'¥'+esc(x.price):'—'}</td><td>${fmt(x.favs)}</td><td>${esc(x.spec||'—')}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">打开商品</a></td></tr>`).join('');$('empty').style.display=list.length?'none':'block';buildAdvice()}
async function analyze(url){const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,maxItems:80})});const raw=await r.text();if(!raw)throw new Error('服务器连接中断');let j;try{j=JSON.parse(raw)}catch{throw new Error('服务器返回异常')}if(!r.ok||!j.ok)throw new Error(j.error||'分析失败');const incoming=(j.items||[]).map(x=>({...x,sourcePage:j.url,addedAt:new Date().toISOString()}));const urls=new Set(incoming.map(x=>x.url));items=items.filter(x=>!urls.has(x.url));items.unshift(...incoming);items=items.slice(0,1200);save();render();return j}
$('run').onclick=async()=>{const urls=[...new Set($('urls').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(!urls.length){status('请先粘贴闲鱼搜索网址。','bad');return}$('run').disabled=true;let total=0;try{for(let i=0;i<urls.length;i++){status(`正在抓取 ${i+1}/${urls.length}\n${urls[i]}`);const j=await analyze(urls[i]);total+=(j.items||[]).length}status(`分析完成：识别 ${total} 个商品，并已生成下一条发布建议。`,'ok')}catch(e){status(e.message,'bad')}finally{$('run').disabled=false}};
$('clear').onclick=()=>{if(confirm('确认清空全部分析数据？')){items=[];save();render();status('已清空。')}};$('filter').oninput=render;$('sort').onchange=render;
$('export').onclick=()=>{if(!items.length){status('没有数据可导出。','bad');return}const c=v=>`"${String(v??'').replace(/"/g,'""')}"`;const rows=[['排名','商品标题','价格','想要','规格','网址'].map(c).join(',')];items.forEach(x=>rows.push([x.rank,x.title,x.price,x.favs,x.spec,x.url].map(c).join(',')));const b=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='闲鱼木地板决策数据_V3.5.csv';a.click()};render();
</script></body></html>
