<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>木地板爆款内容分析器 V3</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#111;--muted:#777;--line:#e4e4de;--soft:#efefe9;--ok:#0d7a44;--warn:#a16600;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px 14px 90px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{font-size:23px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}.badge{background:#111;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.label{font-size:13px;font-weight:800;margin:0 0 7px}
textarea,input,select,button{font:inherit}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;outline:none}textarea{min-height:120px;resize:vertical;line-height:1.55}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary{background:#111;color:#fff}.secondary{background:var(--soft);color:#111}.danger{background:#fff0ee;color:var(--bad)}
.status{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;margin-top:10px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:22px}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:980px;background:#fff}th,td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}th{background:#f8f8f5;position:sticky;top:0}td.title{font-weight:800;max-width:260px}.pill{display:inline-block;background:#f0f0eb;border-radius:999px;padding:4px 7px;font-size:11px;margin:2px 3px 2px 0}.empty{text-align:center;color:var(--muted);padding:28px}.foot{font-size:11px;color:#777;line-height:1.6;margin-top:12px}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>木地板爆款内容分析器</h1><div class="sub">浏览器渲染抓取 · 跨平台公开网址 · 高曝光标题/文案分析</div></div><div class="badge">V3</div></div>
<div class="card">
  <div class="label">公开网址（每行一个，可混放不同网站）</div>
  <textarea id="urls" placeholder="https://www.goofish.com/search?q=木地板&#10;https://其他公开网站/..."></textarea>
  <div class="actions"><button class="primary" id="run">开始分析</button><button class="secondary" id="demo">载入示例</button><button class="danger" id="clear">清空</button></div>
  <div id="status" class="status">V3 会在服务器端用真实浏览器渲染网页，再提取公开可见内容。</div>
</div>
<div class="stats">
  <div class="stat"><b id="sPages">0</b><span>已分析页面</span></div>
  <div class="stat"><b id="sItems">0</b><span>识别商品/内容</span></div>
  <div class="stat"><b id="sViews">0</b><span>识别浏览量</span></div>
  <div class="stat"><b id="sSites">0</b><span>来源网站</span></div>
</div>
<div class="card">
  <div class="toolbar"><input id="filter" placeholder="筛选标题/正文/网站"><select id="sort"><option value="views">浏览量优先</option><option value="engage">互动优先</option><option value="new">最新抓取</option></select><button class="secondary" id="export">导出 CSV</button></div>
  <div class="table-wrap"><table><thead><tr><th>#</th><th>标题</th><th>浏览</th><th>点赞</th><th>收藏/想要</th><th>评论</th><th>发布时间</th><th>来源</th></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty">还没有数据。</div></div>
</div>
<div class="foot">说明：V3 会执行所有你输入的 http/https 公开网址，但不会绕过登录、验证码、权限或访问控制。如果页面要求登录或验证，会标记为“受限页面”，不会尝试规避。</div>
</div>
<script>
const $=x=>document.getElementById(x);let pages=JSON.parse(localStorage.getItem('floorV3Pages')||'[]');let items=JSON.parse(localStorage.getItem('floorV3Items')||'[]');
function save(){localStorage.setItem('floorV3Pages',JSON.stringify(pages));localStorage.setItem('floorV3Items',JSON.stringify(items))}
function fmt(n){if(n==null)return '—';if(n>=10000)return (n/10000).toFixed(n>=100000?0:1)+'万';if(n>=1000)return (n/1000).toFixed(1)+'k';return String(Math.round(n))}
function engage(x){return (x.likes||0)+(x.favs||0)+(x.comments||0)+(x.shares||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function status(t,c=''){$('status').className='status '+c;$('status').textContent=t}
function render(){
  $('sPages').textContent=pages.length;$('sItems').textContent=items.length;$('sViews').textContent=items.filter(x=>x.views!=null).length;$('sSites').textContent=new Set(pages.map(x=>x.site).filter(Boolean)).size;
  let q=$('filter').value.trim().toLowerCase();let a=items.filter(x=>!q||(`${x.title} ${x.text} ${x.site}`).toLowerCase().includes(q));
  let s=$('sort').value;if(s==='views')a.sort((a,b)=>(b.views||-1)-(a.views||-1));else if(s==='engage')a.sort((a,b)=>engage(b)-engage(a));else a.sort((a,b)=>new Date(b.addedAt)-new Date(a.addedAt));
  $('body').innerHTML=a.map((x,i)=>`<tr><td>${i+1}</td><td class="title">${esc(x.title)}</td><td>${fmt(x.views)}</td><td>${fmt(x.likes)}</td><td>${fmt(x.favs)}</td><td>${fmt(x.comments)}</td><td>${x.publishedAt?new Date(x.publishedAt).toLocaleDateString('zh-CN'):'—'}</td><td><a href="${esc(x.url)}" target="_blank">${esc(x.site||'打开')}</a></td></tr>`).join('');
  $('empty').style.display=a.length?'none':'block';
}
async function analyze(url){
  let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,maxItems:60})});
  let j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'分析失败');
  const pageKey=j.url;pages=pages.filter(x=>x.url!==pageKey);pages.unshift({...j,items:undefined,addedAt:new Date().toISOString()});
  const sourceItems=(j.items&&j.items.length?j.items:[{title:j.title||j.url,text:j.text,url:j.url,image:j.image,...j.pageMetrics}]).map(x=>({...x,site:j.site,sourcePage:j.url,blocked:j.blocked,addedAt:new Date().toISOString()}));
  const urls=new Set(sourceItems.map(x=>x.url));items=items.filter(x=>!urls.has(x.url));items.unshift(...sourceItems);items=items.slice(0,1000);save();render();return j;
}
$('run').onclick=async()=>{let urls=[...new Set($('urls').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(!urls.length){status('请先输入公开网址。','bad');return}$('run').disabled=true;let ok=0,fail=0,blocked=0;
for(let i=0;i<urls.length;i++){status(`正在用浏览器分析 ${i+1}/${urls.length}\\n${urls[i]}`);try{let j=await analyze(urls[i]);ok++;if(j.blocked)blocked++;}catch(e){fail++;status(`第 ${i+1} 个网址失败：${e.message}`,'warn')}}
$('run').disabled=false;status(`完成：成功 ${ok}，失败 ${fail}${blocked?`，其中 ${blocked} 个页面检测到登录/验证限制。`:''}`,fail?'warn':'ok')};
$('demo').onclick=()=>{items=[{title:'为什么有人就爱结疤橡木？',text:'工厂实拍',url:'https://example.com/a',site:'example.com',views:12800,likes:286,favs:91,comments:32,publishedAt:new Date().toISOString(),addedAt:new Date().toISOString()},{title:'橡木多层人字拼｜工厂刚生产好的效果',text:'现场拼几块看效果',url:'https://example.org/b',site:'example.org',views:8600,likes:190,favs:76,comments:21,publishedAt:new Date().toISOString(),addedAt:new Date().toISOString()}];pages=[{url:'https://example.com',site:'example.com'}];save();render();status('已载入示例。','ok')};
$('clear').onclick=()=>{if(confirm('确认清空全部数据？')){pages=[];items=[];save();render();status('已清空。')}};$('filter').oninput=render;$('sort').onchange=render;
$('export').onclick=()=>{if(!items.length){status('没有数据可导出。','bad');return}const c=v=>`"${String(v??'').replace(/"/g,'""')}"`;let out=[['标题','浏览','点赞','收藏/想要','评论','发布时间','来源网站','网址'].map(c).join(',')];items.forEach(x=>out.push([x.title,x.views,x.likes,x.favs,x.comments,x.publishedAt,x.site,x.url].map(c).join(',')));let b=new Blob(['\ufeff'+out.join('\n')],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='爆款内容分析_V3.csv';a.click()};render();
</script></body></html>
