<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>木地板爆款内容分析器 V3.4</title>

<style>
:root{
  --bg:#f5f5f2;
  --card:#fff;
  --text:#111;
  --muted:#777;
  --line:#e4e4de;
  --soft:#efefe9;
  --ok:#08783f;
  --warn:#a16600;
  --bad:#b42318
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif
}
.wrap{max-width:1100px;margin:auto;padding:16px 14px 90px}
.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  margin-bottom:14px
}
h1{font-size:23px;margin:0 0 4px}
.sub{font-size:12px;color:var(--muted)}
.badge{
  background:#111;
  color:#fff;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px
}
.label{font-size:13px;font-weight:800;margin:0 0 7px}
textarea,input,select,button{font:inherit}
textarea,input,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  padding:11px 12px;
  outline:none
}
textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.55
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px
}
button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  font-weight:800;
  cursor:pointer
}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#111;color:#fff}
.secondary{background:var(--soft);color:#111}
.danger{background:#fff0ee;color:var(--bad)}
.status{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
  white-space:pre-wrap;
  margin-top:10px
}
.ok{color:var(--ok)}
.warn{color:var(--warn)}
.bad{color:var(--bad)}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px
}
.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px
}
.stat b{font-size:22px}
.stat span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}
.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:10px
}
.toolbar input{flex:1;min-width:0}
.toolbar select{width:auto}
.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px
}
table{
  border-collapse:collapse;
  width:100%;
  min-width:760px;
  background:#fff
}
th,td{
  padding:10px 11px;
  border-bottom:1px solid var(--line);
  font-size:12px;
  text-align:left;
  vertical-align:top
}
th{background:#f8f8f5;position:sticky;top:0}
td.title{font-weight:800;max-width:360px}
.empty{
  text-align:center;
  color:var(--muted);
  padding:28px
}
.foot{
  font-size:11px;
  color:#777;
  line-height:1.6;
  margin-top:12px
}

@media(max-width:680px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{flex-wrap:wrap}
  .toolbar input{width:100%;flex-basis:100%}
}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
  <div>
    <h1>木地板爆款内容分析器</h1>
    <div class="sub">闲鱼商品搜索 · 标题 · 价格 · 想要数据</div>
  </div>
  <div class="badge">V3.4</div>
</div>

<div class="card">

  <div class="label">闲鱼搜索网址</div>

  <textarea
    id="urls"
    placeholder="粘贴闲鱼搜索结果网址，例如：https://www.goofish.com/search?q=木地板"
  ></textarea>

  <div class="actions">
    <button class="primary" id="run">开始分析</button>
    <button class="danger" id="clear">清空数据</button>
  </div>

  <div id="status" class="status">
    粘贴闲鱼搜索网址后直接开始分析。
  </div>

</div>

<div class="stats">

  <div class="stat">
    <b id="sPages">0</b>
    <span>已分析页面</span>
  </div>

  <div class="stat">
    <b id="sItems">0</b>
    <span>识别商品</span>
  </div>

  <div class="stat">
    <b id="sWant">0</b>
    <span>有想要数据</span>
  </div>

  <div class="stat">
    <b id="sSites">0</b>
    <span>来源网站</span>
  </div>

</div>

<div class="card">

  <div class="toolbar">

    <input
      id="filter"
      placeholder="筛选商品标题"
    >

    <select id="sort">
      <option value="want">想要人数优先</option>
      <option value="new">最新抓取</option>
    </select>

    <button
      class="secondary"
      id="export"
    >
      导出 CSV
    </button>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>商品标题</th>
          <th>价格</th>
          <th>想要</th>
          <th>来源</th>
        </tr>
      </thead>

      <tbody id="body"></tbody>

    </table>

    <div
      class="empty"
      id="empty"
    >
      还没有商品数据。
    </div>

  </div>

</div>

<div class="foot">
V3.4：无需提前登录。系统直接尝试分析你粘贴的闲鱼搜索网址；只有闲鱼限制服务器访问时才会提示。
</div>

</div>

<script>

const $ = id =>
  document.getElementById(id);

let pages = JSON.parse(
  localStorage.getItem("floorV34Pages") || "[]"
);

let items = JSON.parse(
  localStorage.getItem("floorV34Items") || "[]"
);

function save(){
  localStorage.setItem(
    "floorV34Pages",
    JSON.stringify(pages)
  );

  localStorage.setItem(
    "floorV34Items",
    JSON.stringify(items)
  );
}

function esc(s){
  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );
}

function fmt(n){

  if(n == null) return "—";

  if(n >= 10000){
    return (
      n / 10000
    ).toFixed(
      n >= 100000 ? 0 : 1
    ) + "万";
  }

  if(n >= 1000){
    return (
      n / 1000
    ).toFixed(1) + "k";
  }

  return String(
    Math.round(n)
  );
}

function status(
  text,
  type = ""
){
  $("status").className =
    "status " + type;

  $("status").textContent =
    text;
}

function render(){

  $("sPages").textContent =
    pages.length;

  $("sItems").textContent =
    items.length;

  $("sWant").textContent =
    items.filter(
      x => x.favs != null
    ).length;

  $("sSites").textContent =
    new Set(
      pages
        .map(x => x.site)
        .filter(Boolean)
    ).size;

  const q =
    $("filter")
      .value
      .trim()
      .toLowerCase();

  let list =
    items.filter(
      x =>
        !q ||
        String(
          x.title || ""
        )
        .toLowerCase()
        .includes(q)
    );

  if(
    $("sort").value === "want"
  ){
    list.sort(
      (a,b) =>
        (b.favs ?? -1) -
        (a.favs ?? -1)
    );
  }else{
    list.sort(
      (a,b) =>
        new Date(b.addedAt) -
        new Date(a.addedAt)
    );
  }

  $("body").innerHTML =
    list.map(
      (x,i) => `
        <tr>
          <td>${i + 1}</td>

          <td class="title">
            ${esc(x.title)}
          </td>

          <td>
            ${
              x.price != null
                ? "¥" + esc(x.price)
                : "—"
            }
          </td>

          <td>
            ${fmt(x.favs)}
          </td>

          <td>
            <a
              href="${esc(x.url)}"
              target="_blank"
              rel="noopener"
            >
              打开商品
            </a>
          </td>
        </tr>
      `
    )
    .join("");

  $("empty").style.display =
    list.length
      ? "none"
      : "block";
}

async function analyze(url){

  const response =
    await fetch(
      "/api/analyze",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          url,
          maxItems:60
        })
      }
    );

  /*
    不再直接 response.json()
    避免服务器异常时出现
    Unexpected end of JSON input
  */

  const raw =
    await response.text();

  if(!raw){
    throw new Error(
      "服务器连接中断，请稍后重新分析"
    );
  }

  let data;

  try{
    data = JSON.parse(raw);
  }catch{
    throw new Error(
      "服务器返回异常，请稍后重新分析"
    );
  }

  if(
    !response.ok ||
    !data.ok
  ){
    throw new Error(
      data.error ||
      "分析失败"
    );
  }

  pages =
    pages.filter(
      x => x.url !== data.url
    );

  pages.unshift({
    url:data.url,
    site:data.site,
    title:data.title,
    addedAt:
      new Date().toISOString()
  });

  const source =
    (data.items || [])
      .map(
        x => ({
          ...x,
          site:data.site,
          sourcePage:data.url,
          addedAt:
            new Date().toISOString()
        })
      );

  const sourceUrls =
    new Set(
      source.map(
        x => x.url
      )
    );

  items =
    items.filter(
      x =>
        !sourceUrls.has(
          x.url
        )
    );

  items.unshift(
    ...source
  );

  items =
    items.slice(
      0,
      1000
    );

  save();
  render();

  return data;
}

$("run").onclick =
async () => {

  const urls = [
    ...new Set(
      $("urls")
        .value
        .split("\n")
        .map(
          x => x.trim()
        )
        .filter(Boolean)
    )
  ];

  if(!urls.length){
    status(
      "请先粘贴闲鱼搜索网址。",
      "bad"
    );

    return;
  }

  $("run").disabled = true;

  let total = 0;
  let success = 0;

  try{

    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      status(
        `正在分析 ${i + 1}/${urls.length}\n${urls[i]}`
      );

      const result =
        await analyze(
          urls[i]
        );

      total +=
        (result.items || [])
          .length;

      success++;
    }

    status(
      `分析完成：识别 ${total} 个商品。`,
      "ok"
    );

  }catch(e){

    status(
      e.message,
      "bad"
    );

  }finally{

    $("run").disabled =
      false;
  }
};

$("clear").onclick =
() => {

  if(
    confirm(
      "确认清空全部分析数据？"
    )
  ){
    pages = [];
    items = [];

    save();
    render();

    status(
      "已清空。"
    );
  }
};

$("filter").oninput =
  render;

$("sort").onchange =
  render;

$("export").onclick =
() => {

  if(!items.length){

    status(
      "没有数据可导出。",
      "bad"
    );

    return;
  }

  const csv =
    v =>
      `"${String(
        v ?? ""
      ).replace(
        /"/g,
        '""'
      )}"`;

  const rows = [
    [
      "商品标题",
      "价格",
      "想要人数",
      "商品网址"
    ]
    .map(csv)
    .join(",")
  ];

  items.forEach(
    x => {

      rows.push(
        [
          x.title,
          x.price,
          x.favs,
          x.url
        ]
        .map(csv)
        .join(",")
      );

    }
  );

  const blob =
    new Blob(
      [
        "\ufeff" +
        rows.join("\n")
      ],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );

  const a =
    document.createElement(
      "a"
    );

  a.href =
    URL.createObjectURL(
      blob
    );

  a.download =
    "闲鱼木地板商品分析_V3.4.csv";

  a.click();
};

render();

</script>

</body>
</html>
