name: Muye V408 contract lifecycle regression
on:
  push:
    branches: [wood-floor-migration-v345-validation]
    paths:
      - 'floor-assistant-v285/index.html'
      - 'ops/muye-guan-jia/v408-contract-check.cjs'
      - '.github/workflows/muye-v408-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Contract end-to-end regression on isolated Render only
        run: node ops/muye-guan-jia/v408-contract-check.cjs
