name: Build deployment package

on:
  push:
    branches: [main]
    paths:
      - 'floor-viral-analyzer-v3/**'
      - '.github/workflows/build-deployment-package.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          rm -f floor-viral-analyzer-v3.zip
          zip -r floor-viral-analyzer-v3.zip floor-viral-analyzer-v3 -x '*.DS_Store'

      - name: Commit latest deployment package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add floor-viral-analyzer-v3.zip
          if git diff --cached --quiet; then
            echo "No package changes"
          else
            git commit -m "chore: refresh deployment package"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: floor-viral-analyzer-v3
          path: floor-viral-analyzer-v3.zip
