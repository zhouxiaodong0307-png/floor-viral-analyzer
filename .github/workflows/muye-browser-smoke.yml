name: Muye emergency real-browser smoke
on:
  push:
    branches: [wood-floor-migration-v345-validation]
    paths:
      - 'floor-assistant-v285/index.html'
      - 'floor-assistant-v285/version.json'
      - '.github/workflows/muye-browser-smoke.yml'
      - 'ops/muye-guan-jia/smoke-browser.cjs'
      - 'ops/muye-guan-jia/ipad-width-v374.cjs'
      - 'ops/muye-guan-jia/refresh-stability-v380.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test real Render staging and production navigation without credentials or writes
        run: node ops/muye-guan-jia/smoke-browser.cjs
      - name: Verify iPad portrait and landscape width and unchanged phone and desktop layouts
        run: node ops/muye-guan-jia/ipad-width-v374.cjs
      - name: Test first visible frames and three consecutive reloads on five viewports
        run: node ops/muye-guan-jia/refresh-stability-v380.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: muye-browser-failure-screenshots
          path: /tmp/muye-*.png
          if-no-files-found: ignore
