name: Muye V406 detail isolated browser regression
on:
  push:
    branches: [wood-floor-migration-v345-validation]
    paths:
      - 'floor-assistant-v285/index.html'
      - 'floor-assistant-v285/order-detail-v404.js'
      - 'floor-assistant-v285/order-detail-v404.css'
      - 'ops/muye-guan-jia/v406-ui-check.cjs'
      - '.github/workflows/muye-v406-detail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v406:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Validate V406 live staging UI, interaction and order immutability
        run: node ops/muye-guan-jia/v406-ui-check.cjs
